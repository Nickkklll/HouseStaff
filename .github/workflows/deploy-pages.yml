name: Deploy frontend to GitHub Pages

on:
  push:
    branches:
      - main
      - feature/centralize-hosting-urls
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Validate backend URL
        run: |
          if [ -z "$REACT_APP_API_ORIGIN" ]; then
            echo "::error::Set the BACKEND_ORIGIN variable in the github-pages environment."
            exit 1
          fi
        env:
          REACT_APP_API_ORIGIN: ${{ vars.BACKEND_ORIGIN }}

      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          REACT_APP_API_ORIGIN: ${{ vars.BACKEND_ORIGIN }}

      - name: Add GitHub Pages SPA fallback
        run: cp build/index.html build/404.html
        working-directory: frontend

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
